<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Special Bar Arbiter v0.1.2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="0.55" stop-color="#2a1855"/>
      <stop offset="1" stop-color="#41207a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- decorative resource bars -->
  <g opacity="0.85">
    <rect x="60" y="52" width="120" height="10" rx="5" fill="#38bdf8" opacity="0.25"/>
    <rect x="60" y="52" width="84"  height="10" rx="5" fill="#38bdf8"/>
    <rect x="60" y="70" width="120" height="10" rx="5" fill="#34d399" opacity="0.25"/>
    <rect x="60" y="70" width="110" height="10" rx="5" fill="#34d399"/>
    <rect x="60" y="88" width="120" height="10" rx="5" fill="#c084fc" opacity="0.25"/>
    <rect x="60" y="88" width="60"  height="10" rx="5" fill="#c084fc"/>
  </g>
  <g opacity="0.85" transform="translate(1200,0) scale(-1,1)">
    <rect x="0" y="52" width="120" height="10" rx="5" fill="#38bdf8" opacity="0.25"/>
    <rect x="36" y="52" width="84" height="10" rx="5" fill="#38bdf8"/>
    <rect x="0" y="70" width="120" height="10" rx="5" fill="#34d399" opacity="0.25"/>
    <rect x="10" y="70" width="110" height="10" rx="5" fill="#34d399"/>
    <rect x="0" y="88" width="120" height="10" rx="5" fill="#c084fc" opacity="0.25"/>
    <rect x="60" y="88" width="60" height="10" rx="5" fill="#c084fc"/>
  </g>

  <!-- title -->
  <text x="600" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="6" fill="#f5f3ff">SPECIAL BAR ARBITER</text>
  <text x="600" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#c4b5fd">The Peacemaker · Bouncer for TrueHUD · SKSE Plugin · Skyrim 1.6.1170+</text>

  <!-- divider -->
  <rect x="340" y="188" width="520" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="600" y="224" text-anchor="middle" font-family="Consolas, monospace" font-size="18" letter-spacing="3" fill="#a5b4fc">ONE BAR · MANY MODS · ZERO CRASHES</text>

  <!-- badges -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="286" y="246" width="92"  height="30" rx="15" fill="#7c3aed"/>
    <text x="332" y="266" fill="#ffffff">v0.1.2</text>

    <rect x="392" y="246" width="140" height="30" rx="15" fill="#312e81"/>
    <text x="462" y="266" fill="#c7d2fe">SKSE · CLibNG</text>

    <rect x="546" y="246" width="80"  height="30" rx="15" fill="#312e81"/>
    <text x="586" y="266" fill="#c7d2fe">MIT</text>

    <rect x="640" y="246" width="130" height="30" rx="15" fill="#312e81"/>
    <text x="705" y="266" fill="#c7d2fe">by gjonete</text>

    <rect x="784" y="246" width="150" height="30" rx="15" fill="#065f46"/>
    <text x="859" y="266" fill="#a7f3d0">battle-tested ⚔️</text>
  </g>
</svg>
