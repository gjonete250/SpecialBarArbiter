name: Build SpecialBarArbiter

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Pin builtin-baseline to current vcpkg HEAD
        shell: pwsh
        run: |
          $commit = git -C "$env:VCPKG_ROOT" rev-parse HEAD
          Write-Host "vcpkg HEAD: $commit"
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $manifest | Add-Member -NotePropertyName builtin-baseline -NotePropertyValue $commit -Force
          $manifest | ConvertTo-Json -Depth 10 | Set-Content vcpkg.json -Encoding utf8
          Get-Content vcpkg.json

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpecialBarArbiter
          path: build/release/*.dll
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
