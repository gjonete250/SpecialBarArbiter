[General]
; Имя DLL плагина, которому разрешено владеть спец-полосками TrueHUD.
; Для вашей сборки это ValhallaCombat. Можно с расширением или без.
; Пробелы по краям значения игнорируются (trim).
SpecialBarOwner=ValhallaCombat
; 1 = подробный лог всех обращений к API (полезно для диагностики).
; По умолчанию (v0.1.2) выключен — для релиза тише и быстрее.
VerboseLog=1

[TargetControl]
; Имя DLL плагина, которому разрешено владеть target control
; (управление выделенной целью, используется True Directional Movement).
; Пустое значение (по умолчанию) = прозрачный проход: любой мод получает control.
; Если хотите ограничить: TargetControlOwner=TrueDirectionalMovement
TargetControlOwner=
